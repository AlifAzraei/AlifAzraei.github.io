 <linearGradient id="green" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#36c58b"/><stop offset="1" stop-color="#07834f"/></linearGradient>
 <linearGradient id="navy" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#1b3a5c"/><stop offset="1" stop-color="#0e223a"/></linearGradient>
 <filter id="shadow" x="-30%" y="-30%" width="160%" height="170%"><feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#24445b" flood-opacity=".16"/></filter>
</defs>
