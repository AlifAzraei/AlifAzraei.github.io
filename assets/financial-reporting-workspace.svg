<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" role="img" aria-labelledby="title desc">
<title id="title">Financial reporting workspace illustration</title>
<desc id="desc">A modern monitor and laptop displaying spreadsheet tables and green analytics charts, with a report, database, calculator and plant.</desc>
<defs>
 <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#e9f8f1"/><stop offset="1" stop-color="#d8eee7"/></linearGradient>
